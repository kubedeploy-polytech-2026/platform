name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  manifests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render controller and applications
        run: |
          image="$(sed -n 's/^          image: //p' controller/workload.yaml)"
          [[ "$image" =~ ^ghcr.io/kubedeploy-polytech-2026/deploy-controller@sha256:[a-f0-9]{64}$ ]]
          for path in controller clusters/local policies; do
            docker run --rm --entrypoint kubectl -v "$PWD:/workspace:ro" "$image" kustomize "/workspace/$path" >/dev/null
          done
      - name: Check Secret script syntax
        run: bash -n scripts/controller-secret.sh
      - name: Install pinned Gator
        run: bash scripts/install-gator.sh
      - name: Test admission policies
        run: python3 -m unittest discover -s tests -v
