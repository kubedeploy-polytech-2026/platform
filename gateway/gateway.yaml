apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kubedeploy
  namespace: kubedeploy-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  gatewayClassName: kubedeploy-envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: local
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: kubedeploy.local
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access.kubedeploy.io/enabled: "true"
