apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kubedeploy-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: System components managed by the KubeDeploy platform
  sourceRepos:
    - docker.io/envoyproxy
    - https://github.com/kubedeploy-polytech-2026/platform.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: envoy-gateway-system
    - server: https://kubernetes.default.svc
      namespace: kubedeploy-gateway
    - server: https://kubernetes.default.svc
      namespace: kubedeploy-system
    - server: https://kubernetes.default.svc
      namespace: kubedeploy-demo
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
