apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequiredresources
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  crd:
    spec:
      names:
        kind: K8sRequiredResources
      validation:
        openAPIV3Schema:
          type: object
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequiredresources

        checked[container] {
          container := input.review.object.spec.containers[_]
        }
        checked[container] {
          container := input.review.object.spec.initContainers[_]
        }
        has_resource(container, section, resource) {
          value := container.resources[section][resource]
          value != ""
          value != null
        }
        missing_resource(container, section, resource) {
          not has_resource(container, section, resource)
        }
        violation[{"msg": msg}] {
          container := checked[_]
          missing_resource(container, "requests", "cpu")
          msg := sprintf("container %q needs requests.cpu", [container.name])
        }
        violation[{"msg": msg}] {
          container := checked[_]
          missing_resource(container, "requests", "memory")
          msg := sprintf("container %q needs requests.memory", [container.name])
        }
        violation[{"msg": msg}] {
          container := checked[_]
          missing_resource(container, "limits", "cpu")
          msg := sprintf("container %q needs limits.cpu", [container.name])
        }
        violation[{"msg": msg}] {
          container := checked[_]
          missing_resource(container, "limits", "memory")
          msg := sprintf("container %q needs limits.memory", [container.name])
        }
