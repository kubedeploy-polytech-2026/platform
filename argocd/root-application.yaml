apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubedeploy-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kubedeploy-polytech-2026/platform.git
    targetRevision: main
    path: clusters/local
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    retry:
      limit: 5
    syncOptions:
      - ServerSideApply=true
      - PruneLast=true
