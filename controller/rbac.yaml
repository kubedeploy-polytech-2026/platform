apiVersion: v1
kind: ServiceAccount
metadata:
  name: deploy-controller
  namespace: kubedeploy-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubedeploy-controller
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [kubedeploy-demo]
    verbs: [get, patch]
  - nonResourceURLs: [/readyz]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubedeploy-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubedeploy-controller
subjects:
  - kind: ServiceAccount
    name: deploy-controller
    namespace: kubedeploy-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deploy-controller
  namespace: kubedeploy-demo
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, patch]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch, create, patch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list, watch, create, patch]
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deploy-controller
  namespace: kubedeploy-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deploy-controller
subjects:
  - kind: ServiceAccount
    name: deploy-controller
    namespace: kubedeploy-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deploy-controller
  namespace: kubedeploy-gateway
rules:
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways]
    resourceNames: [kubedeploy]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deploy-controller
  namespace: kubedeploy-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deploy-controller
subjects:
  - kind: ServiceAccount
    name: deploy-controller
    namespace: kubedeploy-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deploy-controller
  namespace: envoy-gateway-system
rules:
  - apiGroups: [""]
    resources: [services, pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/portforward]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deploy-controller
  namespace: envoy-gateway-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deploy-controller
subjects:
  - kind: ServiceAccount
    name: deploy-controller
    namespace: kubedeploy-system
